# Quarkus DataSource configuration - MySQL (configurable via env vars)
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:root}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:insectos_beneficos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
quarkus.datasource.jdbc.driver=com.mysql.cj.jdbc.Driver

# Hibernate ORM configuration - use Flyway for schema management
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=none
quarkus.hibernate-orm.log.sql=true

# Flyway configuration
quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=false

# HTTP Configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=9000
quarkus.http.root-path=/api
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with

# Jackson Configuration
quarkus.jackson.fail-on-empty-beans=false
