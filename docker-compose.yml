version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: insectos_beneficos_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-insectos_beneficos}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  backend:
    build: 
      context: ./backend/quarkus-app
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: insectos_beneficos_backend
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_USERNAME: ${DB_USER:-user}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://db:3306/${DB_NAME:-insectos_beneficos}
    depends_on:
      - db
    networks:
      - app-network

  frontend-web:
    build:
      context: ./frontend/web
    container_name: insectos_beneficos_web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080/api
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
